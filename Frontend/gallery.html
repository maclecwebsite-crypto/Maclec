<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery — MACLEC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="gallery.css">
  <link rel="icon" type="image/x-icon" href="img/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32-v2.png">
  <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16x16-v2.png">

</head>

<body class="loading">
  <div class="loading-screen" id="loadingScreen">
    <img src="img/logo.png" alt="MACLEC" class="loading-logo">
  </div>

  <!--  HEADER  -->
<header id="site-header-root"></header>
<script src="partials.js"></script>

  <!-- ===== GALLERY HERO ===== -->
  <section class="gallery-hero">
    <div class="gallery-hero-media" aria-hidden="true">
      <div class="gallery-hero-overlay"></div>
    </div>
    <div class="gallery-hero-content">
      <div class="about-tag">Visual Journey</div>
      <h1 class="gallery-hero-title">MACLEC <span class="accent">Gallery</span></h1>
      <p class="gallery-hero-desc">
        Explore our technology, installations, and projects through images and videos.
        Witness dam-free hydropower in action across rivers, canals, and industrial sites worldwide.
      </p>
    </div>
  </section>

  <section class="filter-bar">
    <div class="filter-bar-inner">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="awards">Agreement Signing</button>
      <button class="filter-btn" data-filter="awards">Field Trials</button>
      <button class="filter-btn" data-filter="awards">Patents</button>
      <button class="filter-btn" data-filter="awards">Awards & recognization</button>
      <button class="filter-btn" data-filter="awards">Media Coverage</button>
      <button class="filter-btn" data-filter="certifications">Certifications</button>
      <button class="filter-btn" data-filter="team"> Events</button>
    </div>
  </section>

  <section class="gallery-section">
    <div class="gallery-grid" id="galleryGrid">

      <!-- Gallery items removed: award images deleted from img/. Add new gallery-item blocks here when new media is available. -->
      <p class="gallery-empty-state" style="grid-column:1/-1;text-align:center;padding:60px 20px;opacity:.7;">
        Gallery content coming soon.
      </p>

    </div>
  </section>

  <!-- ===== LIGHTBOX ===== -->
  <div class="lightbox" id="lightbox">
    <div class="lightbox-backdrop"></div>
    <div class="lightbox-content">
      <button class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
      <button class="lightbox-nav lightbox-prev" id="lightboxPrev" aria-label="Previous">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 18l-6-6 6-6" />
        </svg>
      </button>
      <img src="" alt="" class="lightbox-img" id="lightboxImg">
      <div class="lightbox-caption" id="lightboxCaption"></div>
      <button class="lightbox-nav lightbox-next" id="lightboxNext" aria-label="Next">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 18l6-6-6-6" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Video Modal -->
  <div class="video-modal" id="videoModal">
    <div class="video-modal-backdrop"></div>
    <div class="video-modal-content">
      <button class="video-modal-close" id="videoModalClose" aria-label="Close video">&times;</button>
      <video id="videoModalPlayer" controls playsinline></video>
    </div>
  </div>

  <!-- ===== FOOTER ===== -->
  <footer id="site-footer-root"></footer>
<script src="partials.js"></script>

  <script src="gallery.js"></script>
</body>

</html>
